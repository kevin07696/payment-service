version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-server
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/home/appuser/secrets:ro,z  # Mount secrets directory (read-only, SELinux relabel)
    environment:
      # Server
      PORT: ${PORT}

      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: ${DB_SSL_MODE}
      DB_MAX_CONNS: ${DB_MAX_CONNS}
      DB_MIN_CONNS: ${DB_MIN_CONNS}

      # EPX Gateway (endpoints configured in adapters)
      EPX_SERVER_POST_ENDPOINT: ${EPX_SERVER_POST_ENDPOINT}
      EPX_SERVER_POST_SOCKET_ENDPOINT: ${EPX_SERVER_POST_SOCKET_ENDPOINT}
      EPX_KEY_EXCHANGE_ENDPOINT: ${EPX_KEY_EXCHANGE_ENDPOINT}
      EPX_BROWSER_POST_ENDPOINT: ${EPX_BROWSER_POST_ENDPOINT}
      EPX_TIMEOUT: ${EPX_TIMEOUT}

      # Sandbox Merchant (auto-seeded on startup in dev/staging)
      SANDBOX_MERCHANT_ID: ${SANDBOX_MERCHANT_ID}
      SANDBOX_MERCHANT_SLUG: ${SANDBOX_MERCHANT_SLUG}
      SANDBOX_MERCHANT_NAME: ${SANDBOX_MERCHANT_NAME}

      # EPX Sandbox Credentials
      EPX_CUST_NBR: ${EPX_CUST_NBR}
      EPX_MERCH_NBR: ${EPX_MERCH_NBR}
      EPX_DBA_NBR: ${EPX_DBA_NBR}
      EPX_TERMINAL_NBR: ${EPX_TERMINAL_NBR}
      EPX_SANDBOX_MAC: ${EPX_SANDBOX_MAC}

      # North API
      NORTH_MERCHANT_REPORTING_URL: ${NORTH_MERCHANT_REPORTING_URL}
      NORTH_TIMEOUT: ${NORTH_TIMEOUT}

      # Browser POST callback
      CALLBACK_BASE_URL: ${CALLBACK_BASE_URL}

      # Cron configuration
      CRON_SECRET: ${CRON_SECRET}
      CRON_JOB_TIMEOUT_SECONDS: ${CRON_JOB_TIMEOUT_SECONDS}
      CRON_DEFAULT_BATCH_SIZE: ${CRON_DEFAULT_BATCH_SIZE}
      CRON_MAX_BATCH_SIZE: ${CRON_MAX_BATCH_SIZE}

      # Subscription configuration
      SUBSCRIPTION_DEFAULT_MAX_RETRIES: ${SUBSCRIPTION_DEFAULT_MAX_RETRIES}
      SUBSCRIPTION_DEFAULT_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_DEFAULT_GRACE_PERIOD_DAYS}
      SUBSCRIPTION_RETRY_BASE_DELAY_SECS: ${SUBSCRIPTION_RETRY_BASE_DELAY_SECS}
      SUBSCRIPTION_RETRY_MAX_DELAY_SECS: ${SUBSCRIPTION_RETRY_MAX_DELAY_SECS}
      SUBSCRIPTION_RETRY_MULTIPLIER: ${SUBSCRIPTION_RETRY_MULTIPLIER}

      # Authentication
      AUTH_SALT_PREFIX: ${AUTH_SALT_PREFIX}
      AUTH_ENABLED: ${AUTH_ENABLED}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT}

      # Secret Manager
      SECRET_MANAGER: ${SECRET_MANAGER}
      SECRET_CACHE_TTL_MINUTES: ${SECRET_CACHE_TTL_MINUTES}

    ports:
      - "8081:8081"   # All endpoints (ConnectRPC + REST)
    restart: unless-stopped

volumes:
  postgres_data:
